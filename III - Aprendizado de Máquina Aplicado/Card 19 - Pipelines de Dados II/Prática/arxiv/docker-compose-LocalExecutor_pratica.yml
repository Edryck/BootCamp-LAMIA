# LocalExecutor: as tasks de ingestao rodam DE VERDADE em paralelo.
# Com o SequentialExecutor (padrao) elas iriam uma de cada vez -- da
# pra testar a diferenca so trocando o executor e olhando o Gantt View.
x-airflow-common: &airflow-common
  build: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  volumes:
    - ./mnt/airflow/dags:/opt/airflow/dags
    - ./mnt/airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data          # onde os JSONs sao gravados
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create -r Admin -u admin -p admin \
          -e admin@example.com -f Admin -l User || true

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

volumes:
  postgres-db:
